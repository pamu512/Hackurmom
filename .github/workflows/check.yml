name: floor-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The .cursor/skills entries are symlinks; a shallow fetch is fine,
          # but actions/checkout needs the working tree enabled to create them.
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python hackathon/check.py
